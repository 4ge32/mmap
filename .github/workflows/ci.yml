name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per suite, so each shows up as its own self-explanatory status
  # check ("CI / <title>"). Each runs the suite under gcc (emitting a JUnit
  # report) and under ASan/UBSan, then uploads the report for test-report.
  unit-tests:
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: test-vma
            title: "VMA primitives: split/insert/remove/merge & overflow guards"
          - target: test-mmap-ops
            title: "mmap/mprotect/munmap operations & as_wf invariant"
          - target: test-ldso-replay
            title: "ld.so mapping-sequence replay (PROT_NONE reserve → MAP_FIXED segments → bss → GNU_RELRO)"
    steps:
      - uses: actions/checkout@v4

      - name: Run suite (gcc, strict warnings) + emit JUnit
        run: |
          mkdir -p reports
          JUNIT_XML=reports/${{ matrix.target }}.xml make ${{ matrix.target }}

      - name: Run suite under ASan/UBSan
        run: make asan-${{ matrix.target }}

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.target }}
          path: reports/${{ matrix.target }}.xml
          if-no-files-found: error

  clang-portability:
    name: clang build & all unit tests (portability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run all suites with clang
        run: make clean && make test CC=clang

  docs-consistency:
    name: docs/agent_team.md in sync with .claude
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Team page doc references every agent and skill
        run: python3 scripts/check_agent_team_doc.py

  # Consume the JUnit artifacts and publish a per-test breakdown (each test
  # function as a row) in the Checks UI.
  test-report:
    name: Per-test results (Checks UI)
    needs: unit-tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: junit-*
          merge-multiple: true
      - name: Publish JUnit results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/**/*.xml
          check_name: "Unit test results (per test)"
          comment_mode: "off"

  proofs:
    name: Frama-C/WP proofs (informational)
    runs-on: ubuntu-latest
    # The WP tier re-proves from scratch (no warm prover cache on a fresh
    # checkout) on a shared runner; give it generous wall-clock headroom.
    timeout-minutes: 45
    # Non-blocking: the proof tier is additive. But the job now runs the REAL
    # WP tier — PROOF_REQUIRE_WP=1 makes a missing WP plugin a hard failure, so
    # a green check means WP actually ran (no more silent parse-fallback hiding
    # behind success). continue-on-error keeps it from gating the merge while
    # M2 goal discharge is in progress.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # The Ubuntu apt `frama-c` package ships the kernel + RTE but NOT the WP
      # plugin; WP (and Alt-Ergo) come via opam. setup-ocaml provisions a real
      # opam switch (the prior hand-rolled `opam switch create` was slow and
      # silently failed behind `|| true`, so WP never actually installed).
      - name: Set up OCaml + opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"

      - name: Install Frama-C (with WP) + Alt-Ergo + Z3
        run: |
          opam install --yes frama-c alt-ergo z3
          # WP discharges goals through Why3, which must detect the provers;
          # run it inside the opam env and verify Alt-Ergo/Z3 were registered.
          opam exec -- why3 config detect
          echo "--- why3 provers ---"
          opam exec -- why3 config list-provers || true

      - name: Report versions (must show "WP present")
        run: |
          opam exec -- frama-c -version
          if opam exec -- frama-c -wp-help >/dev/null 2>&1; then
            echo "WP present"
          else
            echo "WP absent"
          fi
          opam exec -- alt-ergo --version || echo "alt-ergo absent"
          opam exec -- z3 --version || echo "z3 absent"

      - name: Run WP proofs (require WP — fail visibly if it is missing)
        id: wp
        run: |
          set -o pipefail
          # Larger per-goal timeout than the local default: the runner is slower
          # and has no warm prover cache, so the heaviest goals need headroom.
          opam exec -- make proof PROOF_REQUIRE_WP=1 WP_TIMEOUT=240 2>&1 | tee wp-output.txt
        # No step-level continue-on-error: a missing WP or an undischarged goal
        # makes this step (and the job) visibly red, so a green "proofs" check
        # genuinely means WP ran and proved everything. The job-level
        # continue-on-error still keeps it from gating the merge, and the
        # reporting steps below run regardless via `if: always()`.

      - name: Summarize WP goals
        if: always()
        run: |
          python3 - <<'PY' | tee wp-report.md
          import re
          txt = open("wp-output.txt", encoding="utf-8", errors="replace").read()
          lines = txt.splitlines()
          # Per-goal status lines look like "[wp] Goal <name> : <status>".
          goal = re.compile(r"\[wp\] Goal .*: (.+)$")
          counts = {}
          for l in lines:
              m = goal.search(l)
              if m:
                  counts[m.group(1).strip()] = counts.get(m.group(1).strip(), 0) + 1
          # WP also prints a "Proved goals: N / M" or "[wp] Proved goals" summary.
          summ = re.search(r"Proved goals:\s*(\d+)\s*/\s*(\d+)", txt)
          # Surface prover detection + any fatal errors.
          notable = [l for l in lines if re.search(
              r"Proved goals|No prover|prover|not found|User Error|Fatal|Failure|"
              r"\[kernel\].*[Ee]rror|cannot|Unknown identifier|unbound", l)]
          print("### Frama-C/WP proof report\n")
          if counts:
              print("**Goal status tally:** " +
                    ", ".join(f"`{k}`: {v}" for k, v in sorted(counts.items())) + "\n")
          if summ:
              print(f"**Summary:** {summ.group(1)} / {summ.group(2)} proved\n")
          print("**Notable log lines:**\n")
          print("```")
          print("\n".join(notable[-40:]) or "(none captured)")
          print("```\n")
          total = sum(counts.values())
          ok = counts.get("valid", 0) + counts.get("trivial", 0) + counts.get("Qed", 0)
          if total and ok == total:
              print(f"✅ All {total} WP goals discharged.")
          elif total:
              print(f"⚠️ {ok}/{total} goals discharged; "
                    f"{total - ok} pending (e.g. not tried / unknown / timeout) — M2 in progress.")
          else:
              print("⚠️ No WP goals parsed (WP may have aborted before proving).")
          PY
          cat wp-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post WP report as a sticky PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$(cat wp-report.md)
          marker="<!-- wp-proof-report -->"
          payload=$(python3 -c "import json,sys; print(json.dumps({'body': sys.argv[1]+'\n\n'+sys.argv[2]}))" "$marker" "$body")
          # Find an existing report comment to update; else create one.
          existing=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$PR/comments?per_page=100" \
            | python3 -c "import json,sys; cs=json.load(sys.stdin); print(next((str(c['id']) for c in cs if '$marker' in c.get('body','')), ''))")
          if [ -n "$existing" ]; then
            curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/issues/comments/$existing" \
              -d "$payload" >/dev/null && echo "updated comment $existing"
          else
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$PR/comments" \
              -d "$payload" >/dev/null && echo "created WP report comment"
          fi

  # Build a single static dashboard (test results at a glance + the job
  # dependency graph) and publish it to GitHub Pages. Deploys on main (and
  # manual dispatch); runs even if tests failed, so failures are visible too.
  # NOTE: requires Settings -> Pages -> "Build and deployment" Source = GitHub Actions.
  pages:
    name: Publish results dashboard (GitHub Pages)
    needs: [unit-tests, clang-portability, proofs]
    if: ${{ always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download JUnit reports
        uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: junit-*
          merge-multiple: true

      - name: Build dashboard
        run: |
          python3 tools/gen_dashboard.py \
            --reports reports \
            --workflow .github/workflows/ci.yml \
            --requirements docs/requirements.json \
            --docs docs \
            --out site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
