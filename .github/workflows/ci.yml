name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build & unit tests — gcc, ASan/UBSan, clang (mandatory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          gcc --version
          clang --version
          make --version

      - name: Build core (gcc, strict warnings)
        run: make all

      - name: "Unit tests (gcc) — VMA primitives: split/insert/remove/merge & overflow guards"
        run: make test-vma

      - name: "Unit tests (gcc) — mmap/mprotect/munmap operations & as_wf invariant"
        run: make test-mmap-ops

      - name: "Unit tests (gcc) — ld.so mapping-sequence replay (PROT_NONE reserve → MAP_FIXED segments → bss → GNU_RELRO)"
        run: make test-ldso-replay

      - name: Build all unit tests under ASan/UBSan
        run: make asan-bins

      - name: "ASan/UBSan — VMA primitives & overflow guards"
        run: ./build/test_vma

      - name: "ASan/UBSan — mmap/mprotect/munmap operations & as_wf invariant"
        run: ./build/test_mmap_ops

      - name: "ASan/UBSan — ld.so mapping-sequence replay"
        run: ./build/test_ldso_replay

      - name: "Build & run all unit tests with clang (compiler-portability check)"
        run: make clean && make test CC=clang

  proofs:
    name: Frama-C/WP proofs (informational)
    runs-on: ubuntu-latest
    # Non-blocking: the proof tier is additive. The M2 contracts are authored
    # but not all goals are discharged yet, and prover availability varies, so
    # this job reports status without gating the workflow. Flip to a required
    # check (or set VERIFY_REQUIRE_PROOF=1) once WP goals are fully discharged.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Frama-C and provers
        run: |
          sudo apt-get update
          sudo apt-get install -y frama-c z3 alt-ergo || true

      - name: Detect provers (why3)
        run: why3 config detect || true

      - name: Report versions
        run: |
          frama-c --version || echo "frama-c not installed"
          z3 --version || true
          alt-ergo --version || true

      - name: Run WP proofs
        run: make proof
